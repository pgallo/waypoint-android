name: Android APK

# Kept separate from ci.yml so the CI badge reflects the Rust core and the
# cross-compile, which are fully reproducible, while this workflow covers the
# Gradle/Android build.
on:
  workflow_dispatch:
  push:

jobs:
  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Check APK contents
        working-directory: android
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -E "lib/(arm64-v8a|x86_64)/lib(waypoint_ffi|jnidispatch)\.so"

      - uses: actions/upload-artifact@v4
        with:
          name: waypoint-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
