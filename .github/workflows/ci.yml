name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_NDK_VERSION: 4.1.2

jobs:
  rust:
    name: Rust core (fmt, clippy, test, demo, bindings)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test (unit, property, integration)
        run: cargo test --locked

      - name: CLI demo
        run: cargo run --locked -p waypoint-cli

      - name: Generate Kotlin bindings from the host library
        run: |
          cargo build --locked -p waypoint-ffi -p uniffi-bindgen
          cargo run --locked --bin uniffi-bindgen -- generate \
            --library target/debug/libwaypoint_ffi.so \
            --language kotlin --no-format --out-dir target/kotlin-bindings
          f=target/kotlin-bindings/io/github/pgallo/waypoint/core/waypoint_ffi.kt
          test -s "$f"
          grep -q "class WaypointEngine" "$f"
          grep -q "sealed class CheckInState" "$f"
          wc -l "$f"

  android-cross:
    name: Cross-compile for Android (cargo-ndk)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Build waypoint-ffi for arm64-v8a and x86_64
        run: |
          # The runner image preinstalls an NDK and exports its path as a
          # machine variable (not visible to the `env` expression context).
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk --platform 26 -t arm64-v8a -t x86_64 -o target/jniLibs \
            build --locked --release -p waypoint-ffi

      - name: Inspect native libraries
        run: |
          nm="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for abi in arm64-v8a x86_64; do
            so="target/jniLibs/$abi/libwaypoint_ffi.so"
            test -s "$so"
            n=$("$nm" -D --defined-only "$so" | grep -c "uniffi_waypoint_ffi_fn_" || true)
            echo "$abi: $(du -h "$so" | cut -f1), $n exported UniFFI functions"
            test "$n" -gt 20
          done
