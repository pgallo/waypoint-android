[workspace]
resolver = "2"
members = ["waypoint-core", "waypoint-ffi", "waypoint-cli", "uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Paolo Gallo"]

[workspace.dependencies]
waypoint-core = { path = "waypoint-core" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = "0.32"
proptest = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
