[package]
name = "uniffi-bindgen"
description = "Project-local UniFFI binding generator (pinned to the same uniffi version as the FFI crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
